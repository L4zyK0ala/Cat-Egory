# DRAFT — Turkish brands to watch in Certificate Transparency logs (phishing early warning). Not used yet.
# Review before use: every official domain below must be checked, and tokens must not match ordinary words
# (card names such as "bonus" or "maximum" were left out for that reason).
#
# How a new certificate name will be matched (planned):
#   * the registrable name is lower-cased, IDN-decoded, Turkish letters folded (ı→i, ş→s, ...) and common
#     look-alikes folded (0→o, 1→l, rn→m, vv→w); then split into tokens on "-" "." and digits.
#   * `tokens` (short, ambiguous) match only a whole token: "ptt-kargo-odeme.com" yes, "optt.com" no.
#   * `substrings` (long, distinctive) match anywhere: "garantibbvamobil-giris.net".
#   * `group: true`: the Turkish company of an international group (Vodafone, QNB, DenizBank). The group's
#     companies abroad carry the same name, so the page-proof detector does not take a non-Turkish page under another
#     country's domain (vodafone.al, a .cz partner portal) for it.
#   * names under an `official` domain are ignored; matches are queued for a scan at high priority and always
#     end in human review (a model's suspicion never becomes a published threat flag).
version: draft-2026-11-08
brands:
  # --- banks and payment
  - {name: Garanti BBVA, sector: bank, substrings: [garantibbva], official: [garantibbva.com.tr]}
  - {name: Ziraat Bankası, sector: bank, substrings: [ziraatbank], official: [ziraatbank.com.tr]}  # not "ziraat": agriculture sites
  - {name: İş Bankası, sector: bank, substrings: [isbankasi, isbank], official: [isbank.com.tr]}
  - {name: Akbank, sector: bank, substrings: [akbank], official: [akbank.com]}
  - {name: Yapı Kredi, sector: bank, substrings: [yapikredi], tokens: [worldcard], official: [yapikredi.com.tr]}
  - {name: Halkbank, sector: bank, substrings: [halkbank], official: [halkbank.com.tr]}
  - {name: VakıfBank, sector: bank, substrings: [vakifbank], official: [vakifbank.com.tr]}
  - {name: DenizBank, sector: bank, substrings: [denizbank], official: [denizbank.com], group: true}
  - {name: QNB, sector: bank, substrings: [finansbank], tokens: [qnb], official: [qnb.com.tr], group: true}
  - {name: TEB, sector: bank, tokens: [teb], official: [teb.com.tr]}
  - {name: Enpara, sector: bank, substrings: [enpara], official: [enpara.com]}
  - {name: Kuveyt Türk, sector: bank, substrings: [kuveytturk], official: [kuveytturk.com.tr]}
