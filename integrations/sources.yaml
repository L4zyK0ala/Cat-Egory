# Candidate third-party sources. NOTHING here is synced until a maintainer has read the source's licence and
# terms and recorded them with `python -m integrations.cli approve ...` (stored in source_licenses, audited).
# "believed_license" is our current understanding only and MUST be checked on the source's own site.
# Feed URLs are believed correct as of 2026-11; verify them too. Third-party data is never relicensed.
#
# Discovery sources (discover: true) only bring domains in; backend/app/discovery.py scans them slowly under a
# daily budget, lowest discover_priority first (default 100), then by rank within the source. Filters:
# include_suffixes (e.g. [tr]), max_rank (rows ranked at most N) and max_entries (the first N, in the source's order).
# CSV options: column (the domain column's header), rank_column (the source's own rank instead of the row number),
# registrable_only (www.x.com and m.x.com count as x.com). A feed URL may contain {yyyymm}: the newest monthly file.
sources:
  # What people in Türkiye actually open, from Chrome's real-user data: scanned first.
  - slug: crux-top-tr
    name: Chrome UX Report top sites, Türkiye (top 50,000 origins)
    homepage: https://developer.chrome.com/docs/crux
    terms_url: https://developer.chrome.com/docs/crux/methodology
    feed_url: https://raw.githubusercontent.com/zakird/crux-top-lists/main/data/country/tr/{yyyymm}.csv.gz
    kind: dataset
    format: csv          # gzip; header "origin,rank"; rank is a bucket (1000, 5000, 10000, 50000), random within it
    column: origin
    rank_column: rank
    max_rank: 50000
    registrable_only: true
    discover: true
    discover_priority: 1
    update_interval_seconds: 604800
    attribution: "Chrome UX Report (CrUX) by Google, CC BY 4.0"
    believed_license: >-
      CC BY 4.0 - "CrUX datasets by Google are licensed under a Creative Commons Attribution 4.0 International
      License" (CrUX methodology page). The file is a monthly cache of the public BigQuery table
      chrome-ux-report.experimental.country (github.com/zakird/crux-top-lists). Read by the operator on 2026-11-17.
    license_status: unverified
    notes: ~3.7 MB a month; the top 50,000 origins are ~40,000 sites (~8,100 in the top 10,000). Synced weekly.

  - slug: majestic-million-top
    name: Majestic Million (top 20,000)
    homepage: https://majestic.com/reports/majestic-million
    terms_url: https://majestic.com/reports/majestic-million
    feed_url: https://downloads.majestic.com/majestic_million.csv
    kind: dataset
    format: csv          # header row; the "Domain" column is used
    discover: true
    discover_priority: 3   # the world's popular sites: after what Türkiye opens and the .tr names
    max_entries: 20000
    update_interval_seconds: 604800
    attribution: "Majestic Million, majestic.com, CC BY 3.0"
    believed_license: >-
      CC BY 3.0 Unported - the download page says "Licensed under a Creative Commons Attribution 3.0 Unported
      License" (read 2026-11-08). Approve with --license-slug CC-BY-3.0 after reading it yourself.
    license_status: unverified
    notes: About 80 MB, refreshed daily by Majestic; synced weekly. Ranked by referring subnets.

  - slug: majestic-million-tr
    name: Majestic Million (all .tr domains)
    homepage: https://majestic.com/reports/majestic-million
    terms_url: https://majestic.com/reports/majestic-million
    feed_url: https://downloads.majestic.com/majestic_million.csv
    kind: dataset
    format: csv
    discover: true
    discover_priority: 2
    include_suffixes: [tr]
    update_interval_seconds: 604800
    attribution: "Majestic Million, majestic.com, CC BY 3.0"
    believed_license: >-
      CC BY 3.0 Unported (same list as majestic-million-top, filtered to names ending in .tr).
    license_status: unverified

  - slug: stevenblack-hosts
    name: StevenBlack/hosts (unified)
    homepage: https://github.com/StevenBlack/hosts
    feed_url: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    kind: blocklist
    format: hosts
    category: ads-malware (unified)
    believed_license: MIT (repository); each upstream list in the unified file has its own licence
    license_status: unverified
    notes: Aggregator; provenance per upstream list would be needed for redistribution.

  - slug: oisd
    name: OISD
    homepage: https://oisd.nl/
    kind: blocklist
    format: domains
    believed_license: unknown
    license_status: unverified
    notes: Redistribution terms unknown; ask the maintainer. No feed URL recorded on purpose.

  # Threat lists below are CANDIDATES ONLY (candidates_only: true, threats/feeds.py): their hosts go to
  # threat_feed_entries, a few an hour are scanned (Türkiye-related first) and a person or our own proven detector
  # decides. Their verdicts are never published as threat records, so approve them with --redistribution no.
  - slug: urlhaus
    name: URLhaus recent malware URLs (abuse.ch)
    homepage: https://urlhaus.abuse.ch/
    terms_url: https://abuse.ch/terms-of-use/
    # {abusech_key} is filled in from CATEGORY_ABUSECH_AUTH_KEY at download time (never stored, never logged)
    feed_url: https://urlhaus-api.abuse.ch/v2/files/exports/{abusech_key}/recent.csv
    kind: threat_feed
    threat_type: malware
    format: csv
    column_index: 2      # id,dateadded,url,url_status,... after a commented header
    candidates_only: true
    update_interval_seconds: 21600
    believed_license: abuse.ch Terms of Use (not an open licence; CC0 covers only Feodo Tracker, SSL Blacklist, YARAify)
    license_status: unverified
    notes: >-
      Checked 2026-11-08. Needs an abuse.ch Auth-Key. Terms: free for not-for-profit authenticated users (3.1);
      commercial use may need a paid Spamhaus subscription (4.1); no derivative works or AI training without
      written consent (7.3). Candidates only: a host is scanned and judged by us; nothing of the list is published.
      Mostly malware on IP addresses (skipped: not a domain). Dumps refresh every 5 minutes; we take them 4x a day.

  - slug: phishing-database
    name: Phishing.Database active phishing domains
    homepage: https://github.com/Phishing-Database/Phishing.Database
    feed_url: https://raw.githubusercontent.com/Phishing-Database/Phishing.Database/master/phishing-domains-ACTIVE.txt
    kind: threat_feed
    threat_type: phishing
    format: domains
    candidates_only: true
    update_interval_seconds: 86400
    believed_license: MIT (repository licence, copyright Mitchell Krog, Nissar Chababy and contributors)
    license_status: unverified
    notes: >-
      Candidate checked 2026-11-08, terms read by the operator 2026-11-17. ~390,000 names (11 MB); ~500 are .tr and
      a few hundred resemble watched Turkish brands. Aggregates community reports: candidates only.

  - slug: phishing-database-links
    name: Phishing.Database active phishing links (watched names only)
    homepage: https://github.com/Phishing-Database/Phishing.Database
    feed_url: https://raw.githubusercontent.com/Phishing-Database/Phishing.Database/master/phishing-links-ACTIVE.txt
    kind: threat_feed
    threat_type: phishing
    format: url-list
    candidates_only: true
    watched_only: true   # keep only hosts related to Türkiye or resembling a watched brand (threats/feeds.py)
    update_interval_seconds: 86400
    believed_license: MIT (repository licence, copyright Mitchell Krog, Nissar Chababy and contributors)
    license_status: unverified
    notes: >-
      Same project and licence as phishing-database, the full links instead of host names (~66 MB a day, read
      2026-11-18): the exact page is scanned (threats/pages.py), not the host's home page. Only hosts related to
      Türkiye or resembling a watched brand (integrations/global_brands.yaml) are kept. Candidates only.

  - slug: openphish
    name: OpenPhish community feed
    homepage: https://openphish.com/
    terms_url: https://openphish.com/terms.html
    # openphish.com/feed.txt redirects here; downloads do not follow redirects
    feed_url: https://raw.githubusercontent.com/openphish/public_feed/refs/heads/main/feed.txt
    kind: threat_feed
    threat_type: phishing
    format: url-list
    candidates_only: true
    update_interval_seconds: 21600
    believed_license: free community feed with usage restrictions (commercial use may need a licence)
    license_status: unverified
    notes: Terms read by the operator 2026-11-17. ~300 links, refreshed often; candidates only.

  - slug: phishtank
    name: PhishTank
    homepage: https://phishtank.org/
    kind: threat_feed
    threat_type: phishing
    format: json
    believed_license: free with registration and attribution; new registrations may be closed
    license_status: unverified
    notes: Needs an application key; JSON connector not implemented yet.

  - slug: blocklistproject-gambling
    name: The Block List Project - gambling
    homepage: https://github.com/blocklistproject/Lists
    feed_url: https://blocklistproject.github.io/Lists/alt-version/gambling-nl.txt
    kind: blocklist
    category: gambling
    format: domains
    believed_license: Unlicense
    license_status: unverified
