# The site's snippet with a zonefile added: the last good download survives a restart while the feed is down.
server:
  interface: 0.0.0.0
  access-control: 0.0.0.0/0 allow
  do-ip6: no
  username: ""
  chroot: ""
  use-syslog: no
  verbosity: 1
  module-config: "respip iterator"
rpz:
  name: rpz.cat-egory.
  url: http://10.250.63.10:8000/api/v1/feeds/profile-security.rpz   # site: https://api.cat-egory.org/...
  zonefile: /var/lib/unbound-rpz/rpz.cat-egory.zone
  rpz-action-override: nxdomain
  rpz-log: yes
