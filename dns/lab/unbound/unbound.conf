# Unbound with the Cat-egory list as RPZ from a file that cat-egory-dns-update keeps, after a local allow list.
server:
  interface: 0.0.0.0
  access-control: 0.0.0.0/0 allow
  do-ip6: no
  username: ""
  chroot: ""
  use-syslog: no
  verbosity: 1
  module-config: "respip iterator"   # production: "respip validator iterator"
remote-control:
  control-enable: yes
  control-interface: /run/unbound.ctl
  control-use-cert: no
rpz:
  name: allow.local.
  zonefile: /etc/cat-egory/allow.rpz
rpz:
  name: rpz.cat-egory.
  zonefile: /var/lib/cat-egory-dns/profile-security.rpz
  rpz-log: yes
