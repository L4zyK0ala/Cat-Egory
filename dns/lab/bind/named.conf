// BIND 9 with the Cat-egory list as a response policy zone (RPZ), after a local allow list.
// rndc (reload after an update) uses the key rndc-confgen -a writes; named is started with -4 (no IPv6 here).
include "/etc/bind/rndc.key";
controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };
options {
  directory "/var/bind";
  listen-on { any; };
  listen-on-v6 { none; };
  allow-query { any; };
  recursion yes;
  dnssec-validation no;   // lab only
  response-policy {
    zone "allow.local" policy passthru;
    zone "rpz.cat-egory";
  } qname-wait-recurse no
    min-update-interval 1;   // lab: apply a reload at once (default 60 s: a new list takes effect within a minute)
};
zone "allow.local" { type primary; file "/etc/cat-egory/allow.rpz"; allow-query { none; }; };
zone "rpz.cat-egory" { type primary; file "/var/lib/cat-egory-dns/profile-security.rpz"; allow-query { none; }; };
