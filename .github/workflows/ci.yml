name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, unit, integration, browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: category
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: category_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U category -d category_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CATEGORY_TEST_DATABASE_URL: postgresql+psycopg://category:ci-only-password@127.0.0.1:5432/category_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # same as the Docker images
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints.txt -e '.[dev]'   # the versions the images use
          sudo apt-get update -qq   # a stale package index made the install fail (exit 100)
          sudo apt-get install -y --no-install-recommends redis-server   # tests/unit/test_crawler_redis_acl.py
          python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"       # same as the Docker image
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  compose:
    name: Compose file is valid
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate with dummy values (prints nothing)
        run: |
          cp .env.example .env
          for v in POSTGRES_PASSWORD REDIS_PASSWORD S3_ACCESS_KEY S3_SECRET_KEY GRAFANA_ADMIN_PASSWORD \
                   CATEGORY_FINGERPRINT_SECRET CATEGORY_EGRESS_PROXY_TOKEN \
                   REDIS_CRAWLER_PASSWORD S3_CRAWLER_ACCESS_KEY S3_CRAWLER_SECRET_KEY; do
            sed -i "s|^$v=.*|$v=ci-dummy-value|" .env
          done
          docker compose -f deployment/docker-compose.yml --env-file .env config -q
          docker compose -f deployment/docker-compose.yml -f deployment/docker-compose.nosandbox.yml --env-file .env config -q

  audit:
    name: Known vulnerabilities in Python packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit on the pinned versions (fails on a known vulnerability)
        run: |
          python -m pip install pip-audit==2.7.3
          pip-audit -r requirements/constraints.txt --no-deps --disable-pip --progress-spinner off

  images:
    name: Docker images build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The tests run on the runner's Python and Node, not in the images, so a dependency update that breaks an image
    # build (Playwright 1.65 needing libatomic1, 2026-11-16) would otherwise pass CI. Built, never pushed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: backend, context: ., file: deployment/docker/Dockerfile.backend}
          - {name: crawler, context: ., file: deployment/docker/Dockerfile.crawler}
          - {name: frontend, context: frontend, file: deployment/docker/Dockerfile.frontend}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build ${{ matrix.name }}
        run: docker build --file "${{ matrix.file }}" --tag "cat-egory/${{ matrix.name }}:ci" "${{ matrix.context }}"
      # Fails on a critical vulnerability that has a fix (an upgrade away); the full list is in the job log.
      - name: Scan ${{ matrix.name }} (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: cat-egory/${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
      - name: Fail on critical, fixable findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: cat-egory/${{ matrix.name }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM for ${{ matrix.name }} (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: cat-egory/${{ matrix.name }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json
          retention-days: 30
