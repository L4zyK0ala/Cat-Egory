name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, unit, integration, browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: category
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: category_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U category -d category_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CATEGORY_TEST_DATABASE_URL: postgresql+psycopg://category:ci-only-password@127.0.0.1:5432/category_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same as the Docker images
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"       # same as the Docker image
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  compose:
    name: Compose file is valid
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate with dummy values (prints nothing)
        run: |
          cp .env.example .env
          for v in POSTGRES_PASSWORD REDIS_PASSWORD S3_ACCESS_KEY S3_SECRET_KEY GRAFANA_ADMIN_PASSWORD \
                   CATEGORY_FINGERPRINT_SECRET CATEGORY_EGRESS_PROXY_TOKEN; do
            sed -i "s|^$v=.*|$v=ci-dummy-value|" .env
          done
          docker compose -f deployment/docker-compose.yml --env-file .env config -q
          docker compose -f deployment/docker-compose.yml -f deployment/docker-compose.nosandbox.yml --env-file .env config -q
