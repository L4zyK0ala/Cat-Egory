# Small updates arrive as one grouped PR per ecosystem per week. Major versions of the runtimes and of
# TypeScript are not proposed automatically: they change the Docker images or the compiler, which CI does not
# fully exercise (CI tests Python 3.12 / Node 22, not the images), so they are upgraded deliberately.
version: 2
updates:
  - package-ecosystem: pip
    # Only the exact versions the images install (requirements/constraints.txt). pyproject.toml keeps loose lower
    # bounds; raising them there too opened a second PR that conflicted with the pins (2026-11-20).
    directory: /requirements
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"  # follows the Node runtime in the Docker image (22)
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deployment/docker
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: python   # images pin python 3.12.x; move to a new minor on purpose
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node     # images pin Node 22 LTS
        update-types: [version-update:semver-major]
