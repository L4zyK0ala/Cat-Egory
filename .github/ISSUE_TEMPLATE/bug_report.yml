name: Bug report
description: Something in the code does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, API calls or UI steps. Never paste API keys, .env contents or `docker compose config` output.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. a24a5b6
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
