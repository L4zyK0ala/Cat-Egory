# Cat-egory taxonomy — independent, hand-written definitions.
# Rules (see documentation/TAXONOMY.md):
#   * `id` (slug) and `code` are permanent. Never rename, never reuse. Deprecate + `replaced_by` instead.
#   * Every change bumps `version` (semver): new category = minor, deprecation/redefinition = major, wording = patch.
#   * `kind: risk` categories form the separate security-threat classification.
#   * Groups (`group: true`) organise the tree and are never assigned to a domain.
