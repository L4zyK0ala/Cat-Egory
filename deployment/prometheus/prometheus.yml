rule_files:
  - /etc/prometheus/alerts.yml

global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: cat-egory-api
    metrics_path: /metrics
    static_configs:
      - targets: ["admin-api:8000"]   # /metrics exists only on the admin instance
  # The public API: request counters only, on a port the tunnel does not forward (CATEGORY_METRICS_PORT).
  - job_name: cat-egory-public-api
    static_configs:
      - targets: ["api:9100"]
  # The public site answers /healthz in the exposition format, so `up` says whether it serves pages.
  - job_name: cat-egory-site
    metrics_path: /healthz
    static_configs:
      - targets: ["frontend:3000"]
