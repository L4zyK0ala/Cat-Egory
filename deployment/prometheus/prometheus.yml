rule_files:
  - /etc/prometheus/alerts.yml

global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: cat-egory-api
    metrics_path: /metrics
    static_configs:
      - targets: ["admin-api:8000"]   # /metrics exists only on the admin instance
