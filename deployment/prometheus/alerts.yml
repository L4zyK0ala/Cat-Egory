# severity: critical alerts reach Telegram through Alertmanager; warning alerts stay in Prometheus.
# `summary` is what Prometheus and Grafana show; `telegram` is the Turkish text of the Telegram message (the operator
# reads Turkish). Write it for someone on a phone: what is wrong and where to look.
groups:
  - name: cat-egory
    rules:
      - alert: ApiDown
        expr: up{job="cat-egory-api"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Cat-egory API is not being scraped"
          telegram: "API'ye 5 dakikadır ulaşılamıyor. admin-api kapsayıcısına bakın."
      # What visitors use. ApiDown above is the admin instance; these two are the containers behind the tunnel.
      - alert: PublicApiDown
        expr: up{job="cat-egory-public-api"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "The public API is not answering"
          telegram: "Herkese açık API'ye 5 dakikadır ulaşılamıyor, site veri gösteremiyor. api kapsayıcısına bakın."
      - alert: SiteDown
        expr: up{job="cat-egory-site"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "The public site is not answering"
          telegram: "Herkese açık site 5 dakikadır yanıt vermiyor. frontend kapsayıcısına bakın."
      - alert: DatabaseMetricsDown
        expr: category_db_metrics_up == 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "API cannot read the database for metrics"
          telegram: "API 10 dakikadır veritabanını okuyamıyor. postgres kapsayıcısına bakın."
      - alert: ScanBacklog
        expr: category_scan_jobs{status="queued"} > 5000
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "More than 5000 scans waiting for an hour"
          telegram: "Bir saattir 5000'den fazla tarama sırada bekliyor."
      # The task, not the newest release: an unchanged list rightly produces no release.
      - alert: FeedsStale
        expr: time() - category_task_last_success_timestamp_seconds{task="category.feeds.build"} > 3 * 3600
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: "The feed build has not succeeded for 3 hours"
          telegram: "Listeler 3 saattir derlenemedi. worker kayıtlarına bakın."
      - alert: AiInvalidAnswers
        expr: sum(category_ai_predictions_24h{status!="valid"}) / clamp_min(sum(category_ai_predictions_24h), 1) > 0.2
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "More than 20% of AI answers in 24 h were invalid or failed"
          telegram: "Son 24 saatte yapay zekâ yanıtlarının %20'den fazlası geçersiz ya da hatalı."
      - alert: ApiErrors
        expr: sum(rate(category_http_requests_total{status=~"5.."}[10m])) > 0.1
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "API is returning 5xx responses (public or admin instance)"
          telegram: "API 10 dakikadır sunucu hatası (5xx) veriyor. api ve admin-api kayıtlarına bakın."
      # Celery heartbeats: the dispatcher runs every 10 s, so a quiet 5 minutes means beat or the worker stopped.
      - alert: SchedulerStopped
        expr: time() - category_task_last_success_timestamp_seconds{task="category.scan.dispatch"} > 300
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "No scan dispatch for 5 minutes: Celery beat or the worker is not running"
          telegram: "Tarama dağıtıcısı 5 dakikadır çalışmadı, taramalar durdu. beat ve worker-scan kapsayıcılarına bakın."
      - alert: SchedulerNeverRan
        expr: absent(category_task_last_success_timestamp_seconds{task="category.scan.dispatch"}) and on() up{job="cat-egory-api"} == 1
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "No task heartbeat recorded yet: Celery beat or the worker has not run"
          telegram: "Henüz hiçbir görev çalışmadı. beat ve worker kapsayıcıları başlamamış olabilir."
      # A suspected threat normally finishes crawling in minutes. Stuck: worker-fast or the crawler is down.
      - alert: FastLaneStuck
        expr: category_fast_lane_oldest_seconds > 1200
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "A suspected threat has waited over 20 minutes in the fast lane: check worker-fast and the crawler"
          telegram: "Şüpheli bir site 20 dakikadan uzun süredir hızlı şeritte bekliyor. worker-fast ve crawler'a bakın."
      - alert: DiscoveryStopped
        expr: time() - category_task_last_success_timestamp_seconds{task="category.discovery.queue"} > 3600
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "The discovery task has not succeeded for an hour"
          telegram: "Keşif görevi bir saattir çalışmadı, yeni site eklenmiyor."
      - alert: HeartbeatsUnreadable
        expr: category_heartbeats_up == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "API cannot read task heartbeats from Redis"
          telegram: "API görev sinyallerini Redis'ten okuyamıyor."
      - alert: CtWatchStopped
        expr: time() - category_task_last_success_timestamp_seconds{task="ct-watch.stream"} > 600
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "The certificate-transparency watch has not received names for 10 minutes"
          telegram: "Sertifika izlemesi 10 dakikadır yeni alan adı almıyor. certstream ve ct-watch'a bakın."
      # A crawler that cannot start browsers fails every scan until someone restarts it (2026-11-09).
      - alert: CrawlerOutage
        expr: category_infra_failures_1h >= 20
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "20+ scans failed on our side in the last hour (sandbox, storage or proxy); discovery has paused"
          telegram: "Son bir saatte 20'den fazla tarama bizim tarafımızda başarısız oldu (tarayıcı, depolama ya da proxy). Keşif duraklatıldı; crawler'ı yeniden başlatmak gerekebilir."
      - alert: BackupStale
        expr: time() - category_task_last_success_timestamp_seconds{task="backup.nightly"} > 30 * 3600
        for: 1h
        labels: {severity: critical}
        annotations:
          summary: "No successful backup for more than 30 hours"
          telegram: "30 saattir başarılı yedek alınmadı. Gece yedeği zamanlayıcısına bakın."
      # Only once the off-site copy was set up (the heartbeat exists from its first run on).
      - alert: OffsiteBackupStale
        expr: time() - category_task_last_success_timestamp_seconds{task="backup.offsite"} > 36 * 3600
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "No successful off-site backup for more than 36 hours (sudo ./deployment/scripts/offsite-backup.sh snapshots)"
          telegram: "36 saattir sunucu dışına yedek gönderilmedi (sudo ./deployment/scripts/offsite-backup.sh snapshots)."
      # --- the host (node-exporter, docker-cleanup.sh) ---------------------------------------------------------------
      - alert: HostMetricsDown
        expr: up{job=~"node|processes"} == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Host metrics are not being scraped ({{ $labels.job }})"
          telegram: "Sunucu metrikleri 10 dakikadır alınamıyor. node-exporter / process-exporter kapsayıcılarına bakın."
      - alert: HostDiskFilling
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint=~"/|/mnt/yedek"} / node_filesystem_size_bytes{mountpoint=~"/|/mnt/yedek"}) > 80
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.mountpoint }} is more than 80 % full"
          telegram: "{{ $labels.mountpoint }} diskinin %80'inden fazlası dolu."
      # A full system disk stops PostgreSQL and every container (the build cache once reached 85 %, 2026-11-17).
      - alert: HostDiskFull
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 90
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "The system disk is more than 90 % full"
          telegram: "Sistem diskinin %90'ından fazlası dolu; dolarsa veritabanı durur. sudo docker system df ile bakın, sudo ./deployment/scripts/docker-cleanup.sh çalıştırın."
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Less than 10 % of memory available for 15 minutes"
          telegram: "15 dakikadır kullanılabilir bellek %10'un altında."
      # Only once the timer has run (the metric exists from its first run on).
      - alert: DockerCleanupStale
        expr: time() - category_docker_cleanup_last_success_timestamp_seconds > 8 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "The weekly Docker cleanup has not succeeded for 8 days (systemctl status docker-cleanup.service)"
          telegram: "Haftalık Docker temizliği 8 gündür başarılı olmadı (systemctl status docker-cleanup.service)."
