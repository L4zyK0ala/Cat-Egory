[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-egory"
version = "0.1.0.dev0"
description = "Open Web Intelligence & Categorization Platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "tldextract>=5.1",
    "idna>=3.10",
    "pyyaml>=6.0",
    "python-json-logger>=3.2",
    "prometheus-client>=0.21",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
    "dnspython>=2.7",
    "boto3>=1.35",
]

[project.optional-dependencies]
crawler = ["playwright==1.64.1"]
dev = ["pytest>=8.3", "respx>=0.22", "ruff>=0.8", "jsonschema>=4.23", "fakeredis>=2.26", "moto[s3]>=5.0", "playwright==1.64.1"]

[tool.setuptools.packages.find]
include = ["common*", "database*", "ai_providers*", "classification*", "crawler*", "integrations*", "feeds*", "backend*"]

[tool.setuptools.package-data]
classification = ["taxonomy.yaml", "evaluation_set.yaml"]
integrations = ["sources.yaml"]
database = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs PostgreSQL (CATEGORY_TEST_DATABASE_URL)"]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
